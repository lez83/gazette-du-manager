# Publie La Gazette du Manager sur GitHub Pages a chaque envoi sur main.
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer les dependances
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Adapter les chemins des images au sous-dossier du site
        run: |
          grep -rlE "['\"]/src/assets/" src | xargs -r sed -i -E "s#(['\"])/src/assets/#\1${BASE}/src/assets/#g"
      - name: Construire le site
        run: npx vite build --base="${BASE}/"
      - name: Copier les images
        run: |
          mkdir -p dist/src/assets
          cp -r src/assets/. dist/src/assets/
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
